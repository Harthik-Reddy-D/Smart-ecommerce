{% extends "base.html" %}{% block content %}<h1 class="text-3xl font-bold mb-5">Order History</h1><div class="space-y-3">{% for o in orders %}<a href="{% url 'orders:detail' o.id %}" class="block bg-white p-4 rounded-xl"><b>Order #{{ o.id }}</b><span class="ml-4">₹{{ o.total }}</span><span class="ml-4">{{ o.get_order_status_display }}</span><span class="ml-4">{{ o.get_payment_status_display }}</span></a>{% empty %}<p>No orders yet.</p>{% endfor %}</div>{% endblock %}
